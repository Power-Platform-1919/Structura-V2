<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structra: JSON Analyzer</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Styles -->
  <link rel="stylesheet" href="src/css/fonts.css">
  <link rel="stylesheet" href="src/css/tokens.css">
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/ui.css">
  <link rel="stylesheet" href="src/css/layout.css">
  <link rel="stylesheet" href="src/css/shell.css">
  <link rel="stylesheet" href="src/css/overview.css">
  <link rel="stylesheet" href="src/css/panels.css">
  <link rel="stylesheet" href="src/css/codeview.css">
  <link rel="stylesheet" href="src/css/overlays.css">
  <link rel="stylesheet" href="src/css/components.css">
  <link rel="stylesheet" href="src/css/theme-panel.css">
</head>
<body>
  <!-- App splash screen - visible immediately, hidden when ready -->
  <div class="app-splash" id="appSplash">
    <div class="app-splash-inner">
      <div class="app-splash-spinner"></div>
      <div class="app-splash-title">Structra</div>
      <div class="app-splash-msg" id="splashMsg">Loading resources…</div>
      <div class="app-splash-steps" id="splashSteps" style="font-size:11px;color:var(--text-muted,#666);margin-top:8px"></div>
    </div>
  </div>
  <script>
    // Lightweight splash updater - runs before any module loads
    window.__splashStep = function(msg) {
      var el = document.getElementById('splashMsg');
      if (el) el.textContent = msg;
    };
  </script>

  <div class="app" style="visibility:hidden" id="appRoot">
    <!-- Header row -->
    <structra-header class="app-header"></structra-header>

    <!-- Tab bar row -->
    <structra-tabs class="app-tab-bar"></structra-tabs>

    <!-- Workspace row -->
    <div class="app-workspace">
      <structra-rail class="app-rail"></structra-rail>

      <!-- Query panel (togglable) -->
      <structra-query class="app-query-panel" id="queryPanel"></structra-query>

      <!-- Canvas (main content area) -->
      <main class="app-canvas" id="canvas">
        <structra-find></structra-find>
        <structra-filter></structra-filter>
        <structra-canvas-header class="app-canvas-header" id="canvasHeader"></structra-canvas-header>
        <structra-breadcrumb class="app-breadcrumb"></structra-breadcrumb>
        <structra-view-switcher class="app-view" id="viewPanel">
        </structra-view-switcher>
        <div class="app-empty-state" id="canvasEmpty" style="display:none">
          <structra-input-panel mode="inline"></structra-input-panel>
        </div>
        <structra-drawer class="app-drawer collapsed" id="drawer"></structra-drawer>
      </main>

      <!-- Context panel (togglable) -->
      <structra-context class="app-context-panel" id="contextPanel"></structra-context>
    </div>

    <!-- Status bar row -->
    <structra-status class="app-status-bar"></structra-status>
  </div>

  <!-- Overlays -->
  <structra-toast></structra-toast>
  <structra-command></structra-command>
  <structra-typedef></structra-typedef>
  <structra-shortcuts></structra-shortcuts>
  <structra-settings></structra-settings>
  <structra-loading></structra-loading>
  <structra-diff></structra-diff>
  <structra-nullfinder></structra-nullfinder>
  <structra-pivot></structra-pivot>
  <structra-minimap></structra-minimap>
  <structra-snippets></structra-snippets>
  <structra-workspace></structra-workspace>
  <structra-heatmap></structra-heatmap>
  <structra-validate></structra-validate>
  <structra-theme></structra-theme>
  <structra-welcome></structra-welcome>
  <structra-charts></structra-charts>
  <structra-zoom></structra-zoom>
  <structra-autocomplete></structra-autocomplete>

  <!-- Scripts: core first, then components -->
  <script src="src/core/safe-storage.js"></script>
  <script src="src/core/logger.js"></script>
  <script src="src/core/shared-helpers.js"></script>
  <!-- Lucide icons: CDN first, bundled copy if the CDN is unreachable. Only icon artwork is fetched; data never leaves the page. -->
  <script src="src/vendor/lucide.min.js"></script>
  <script>window.lucide || document.write('<script src="src/vendor/lucide.min.js"><\/script>');</script>
  <script src="src/core/icons.js"></script>
  <script src="src/core/app-settings.js"></script>
  <script src="src/core/theme-engine.js"></script>
  <script src="src/core/component-base.js"></script>
  <script src="src/core/dialog-base.js"></script>
  <script src="src/core/app-state-and-events.js"></script>
  <!-- Worker sources registered for Blob URL fallback on file:// -->
  <script src="src/workers/xml-parse-worker.js"></script>
  <script src="src/workers/engine-worker.js"></script>
  <!-- Parser libs for sync fallback on file:// -->
  <script src="src/libs/papaparse.min.js"></script>
  <script src="src/libs/csv-typing.js"></script>
  <script src="src/libs/js-yaml.min.js"></script>
  <script src="src/libs/toml.min.js"></script>
  <script src="src/core/worker-pool.js"></script>
  <script src="src/core/library-loader.js"></script>
  <script src="src/core/code-view.js"></script>
  <script src="src/core/panel-resizer.js"></script>
  <script src="src/core/data-paths.js"></script>
  <script src="src/core/app-constants.js"></script>
  <!-- Virtualization + JSON tree renderer -->
  <script src="src/core/virtual-list.js"></script>
  <script src="src/core/json-tree-renderer.js"></script>
  <!-- Data engine layer -->
  <script src="src/core/browser-database.js"></script>
  <script src="src/core/data-engine.js"></script>
  <script src="src/core/duckdb-adapter.js"></script>
  <!-- Paths and Power Platform expression generators -->
  <script src="src/core/json-repair-and-validation.js"></script>
  <script src="src/core/json-diff.js"></script>
  <script src="src/core/overview-insights.js"></script>
  <script src="src/core/share-and-capture.js"></script>
  <script src="src/core/power-platform-expressions.js"></script>
  <script src="src/core/parse-json-schema-generator.js"></script>
  <script src="src/core/path-history.js"></script>
  <script src="src/core/bookmarks.js"></script>

  <!-- Utility modules -->
  <script src="src/core/transform-step-operations.js"></script>
  <script src="src/core/personal-data-masker.js"></script>
  <script src="src/core/mock-data-generator.js"></script>
  <script src="src/core/undo-stack.js"></script>
  <script src="src/core/jsonpath-query.js"></script>
  <script src="src/core/type-code-generator.js"></script>
  <script src="src/core/format-conversion.js"></script>

  <!-- Phase 1: Shell components -->
  <script src="src/components/structra-toast.js"></script>
  <script src="src/components/structra-header.js"></script>
  <script src="src/components/structra-tabs.js"></script>
  <script src="src/components/structra-rail.js"></script>
  <script src="src/components/structra-status.js"></script>

  <!-- Phase 2: Canvas components -->
  <script src="src/components/structra-canvas-header.js"></script>
  <script src="src/components/structra-breadcrumb.js"></script>
  <script src="src/components/structra-view-switcher.js"></script>
  <script src="src/components/structra-drawer.js"></script>
  <script src="src/components/structra-drawer-stats.js"></script>
  <script src="src/components/structra-expressions.js"></script>
  <script src="src/components/structra-schemagen.js"></script>
  <script src="src/components/structra-tree.js"></script>
  <script src="src/components/structra-input-panel.js"></script>
  <script src="src/components/structra-find.js"></script>
  <script src="src/components/structra-filter.js"></script>

  <!-- Phase 3: Alternate views -->
  <script src="src/components/structra-table.js"></script>
  <script src="src/components/structra-graph.js"></script>
  <script src="src/components/structra-schema.js"></script>
  <script src="src/components/structra-editor.js"></script>
  <script src="src/components/structra-overview.js"></script>

  <!-- Phase 4: Panels -->
  <script src="src/components/structra-query.js"></script>
  <script src="src/components/structra-context.js"></script>

  <!-- Phase 5: Overlays -->
  <script src="src/components/structra-command.js"></script>
  <script src="src/components/structra-typedef.js"></script>
  <script src="src/components/structra-shortcuts.js"></script>
  <script src="src/components/structra-settings.js"></script>
  <script src="src/components/structra-loading.js"></script>

  <!-- Phase 5: New features -->
  <script src="src/components/structra-diff.js"></script>
  <script src="src/components/structra-nullfinder.js"></script>
  <script src="src/components/structra-pivot.js"></script>
  <script src="src/components/structra-minimap.js"></script>
  <script src="src/components/structra-snippets.js"></script>
  <script src="src/components/structra-workspace.js"></script>
  <script src="src/components/structra-heatmap.js"></script>
  <script src="src/components/structra-validate.js"></script>
  <script src="src/components/structra-theme.js"></script>
  <script src="src/components/structra-welcome.js"></script>
  <script src="src/components/structra-charts.js"></script>
  <script src="src/components/structra-zoom.js"></script>
  <script src="src/components/structra-autocomplete.js"></script>

  <!-- App bootstrap -->
  <script src="src/app.js"></script>
</body>
</html>
