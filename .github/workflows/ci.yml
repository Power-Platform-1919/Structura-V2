name: CI

# Runs the checks and tests on every pull request into dev, test or prod, and on every push to dev and test.
# Pushes to prod are not checked here: by then the same code has already passed on dev and test, and prod deploys the site.
#
# Three jobs run at the same time, so the run takes as long as the slowest one:
#   checks          lint and unit tests (seconds)
#   browser         the browser tests, four at a time in shared browsers (tests/run-smoke.js)
#   ui-audit        colours in every theme, layout, accessibility and random clicking (tests/ui/run-all.js)
#   other-browsers  the browser tests again in Firefox and in WebKit (the engine of Safari), one job each
# The browser download is cached between runs (about a minute saved each time).

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Code checks (ESLint)
        run: npm run lint
      - name: Unit tests
        run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remember the downloaded browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the system libraries the browser needs
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests
        run: npm run test:browser

  other-browsers:
    name: Browser tests in ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remember the downloaded browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Install the system libraries the browser needs
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.engine }}
      - name: Browser tests in ${{ matrix.engine }}
        run: node tests/run-smoke.js --engine=${{ matrix.engine }} 3

  ui-audit:
    name: UI audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remember the downloaded browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the system libraries the browser needs
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: UI audit (colours in every theme, layout, accessibility, random clicking)
        run: npm run ui:audit
      - name: Keep the audit screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: .playwright-mcp/ui-audit
          if-no-files-found: ignore
