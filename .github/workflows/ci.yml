name: CI

# Runs the checks and tests on every pull request into dev, test or prod, and on every push to dev and test.
# Pushes to prod are not checked here: by then the same code has already passed on dev and test, and prod deploys the site.
#
# Jobs run at the same time, so the run takes as long as the slowest one:
#   checks          lint and unit tests (seconds)
#   browser         the browser tests, four at a time in shared browsers (tests/run-smoke.js)
#   ui-audit        colours in every theme, layout, accessibility and random clicking (tests/ui/run-all.js)
#   other-browsers  the browser tests again in Firefox and in WebKit (the engine of Safari), one job each
#
# The browser jobs run inside Microsoft's Playwright image. The browsers and the system libraries are already in it, so there is no
# download and no apt-get on the runner. Before this, every run installed them on the runner: the same step took 16 seconds in one
# job and 5 minutes in another (the Ubuntu package servers vary), and twice it stalled for 8 minutes.
# The image tag must equal the "playwright" version in package-lock.json (tests/unit/ci-image.test.js checks it): when Playwright
# is upgraded, change the tag in the three places below.

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Code checks (ESLint)
        run: npm run lint
      - name: Unit tests
        run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Browser tests
        run: npm run test:browser

  other-browsers:
    name: Browser tests in ${{ matrix.engine }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 25
    # Not required yet: this job is new, and its time is still being tuned. It reports, but a failure here does not block a merge.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Browser tests in ${{ matrix.engine }}
        run: node tests/run-smoke.js --engine=${{ matrix.engine }} 3

  ui-audit:
    name: UI audit
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: UI audit (colours in every theme, layout, accessibility, random clicking)
        run: npm run ui:audit
      - name: Keep the audit screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: .playwright-mcp/ui-audit
          if-no-files-found: ignore
